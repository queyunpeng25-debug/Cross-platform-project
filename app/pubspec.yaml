name: cs_building_guide
description: "CS Explorer: interactive cross-platform guide to the Aalto CS building."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  http: ^1.6.0
  ar_flutter_plugin_plus:
    path: packages/ar_flutter_plugin_plus
  vector_math: ^2.4.0
  zenify: ^2.2.2
  go_router: ^18.0.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content.json
    - assets/ar_targets.json
    - assets/stations_data.json
    - assets/scan_triggers.json
    - assets/i18n/en.json
    - assets/portraits/
    - assets/ar_panels/
    - assets/computers/
    - assets/stations/
